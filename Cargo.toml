[package]
name = "washi"
description = "Grainy, dithered gradient backgrounds - MCP server and CLI"
version = "0.1.0"
license = "MIT"
repository = "https://github.com/Idered/washi"
edition = "2024"

[dependencies]
ab_glyph = "0.2.32"
base64 = "0.23.1"
clap = { version = "4.6.8", features = ["derive"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[lib]
path = "src/lib.rs"

[[bin]]
name = "washi"
path = "src/bin/washi.rs"

[[bin]]
name = "washi-mcp"
path = "src/bin/washi-mcp.rs"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
