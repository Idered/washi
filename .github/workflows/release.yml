# Builds washi for every platform and stages the npm packages (npx washi-mcp) for approval.
#
# Release: bump `version` in Cargo.toml, commit, then push a matching tag:
#   git tag v0.1.0 && git push origin v0.1.0
# Approve the staged packages on npmjs.com afterwards. Running the workflow by hand from the
# Actions tab builds everything and does a dry run of the publish.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            targets: aarch64-apple-darwin x86_64-apple-darwin
          - os: ubuntu-latest
            targets: x86_64-unknown-linux-musl aarch64-unknown-linux-musl
          - os: windows-latest
            targets: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    env:
      # static musl binaries linked with Rust's bundled lld, so no cross toolchain is needed
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: rust-lld
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: rust-lld
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        shell: bash
        run: |
          for t in ${{ matrix.targets }}; do
            rustup target add "$t"
            cargo build --release --locked --target "$t"
            mkdir -p "bins/$t"
            cp target/$t/release/washi{,-mcp}{,.exe} "bins/$t/" 2>/dev/null || true
            ls -l "bins/$t"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: bins-${{ matrix.os }}
          path: bins/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # for npm trusted publishing (OIDC), once it's set up
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest # staged publishing needs npm 11.15+
      - uses: actions/download-artifact@v5
        with:
          pattern: bins-*
          path: bins
          merge-multiple: true
      - name: Check the tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME doesn't match Cargo.toml version $version"; exit 1; }
      - name: Check the npm token
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then echo "No NPM_TOKEN secret; relying on trusted publishing"; exit 0; fi
          echo "NPM_TOKEN is ${#NODE_AUTH_TOKEN} characters"
          echo "Logged in to npm as $(npm whoami)"
      - name: Pack
        run: node npm/scripts/pack.js bins
      # Staged: the packages are uploaded but stay private until a maintainer approves them with 2FA
      # (npmjs.com > Account > Staged Packages, or `npm stage list` + `npm stage approve <id>`).
      # Auth is the NPM_TOKEN secret (a "stage only" granular token) or, once configured, trusted publishing.
      - name: Stage publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          flags="--access public"
          [[ "$GITHUB_REF" == refs/tags/* ]] || flags="$flags --dry-run"
          # Platform packages first, so the launcher's optional dependencies exist when it's approved.
          # Each package is tried even if an earlier one fails, and versions already on npm are skipped,
          # so a failed release can simply be re-run.
          failed=()
          for dir in dist/npm/washi-mcp-*/ dist/npm/washi-mcp/; do
            spec=$(node -p "const p = require('./$dir/package.json'); p.name + '@' + p.version")
            if npm view "$spec" version >/dev/null 2>&1; then echo "$spec is already published, skipping"; continue; fi
            (cd "$dir" && npm stage publish $flags) || failed+=("$spec")
          done
          if [ ${#failed[@]} -gt 0 ]; then echo "::error::Not staged: ${failed[*]}"; exit 1; fi
